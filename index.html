<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Broken Pizza — Admin franchise</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="wrap desktop">
    <header>
      <div>
        <h1>Broken Pizza Gestion</h1>
        <p class="sub">Tableau de bord franchise — format PC</p>
      </div>
      <button id="btnLogout" class="secondary hidden" type="button">Déconnexion</button>
    </header>

    <section id="loginView" class="card login-card">
      <p class="sub">Connexion admin (compte autorisé uniquement).</p>
      <label>E-mail
        <input id="email" type="email" autocomplete="username" value="pizzabroken38@gmail.com" />
      </label>
      <label>Mot de passe
        <input id="password" type="password" autocomplete="current-password" />
      </label>
      <div class="row">
        <button id="btnLogin" type="button">Se connecter</button>
      </div>
      <p id="loginErr" class="err"></p>
    </section>

    <section id="listView" class="hidden">
      <div class="toolbar">
        <button id="btnRefresh" type="button">Actualiser</button>
        <label class="chk">
          <input id="hideTests" type="checkbox" checked />
          Masquer les comptes test
        </label>
        <p id="dashStatus" class="sub"></p>
      </div>
      <p id="dashErr" class="err"></p>
      <div class="table-wrap card">
        <table class="truck-table" id="truckTable">
          <thead>
            <tr>
              <th>Camion</th>
              <th>Ville</th>
              <th>CA mois</th>
              <th>Dernière sync</th>
              <th>Sync</th>
            </tr>
          </thead>
          <tbody id="truckTableBody"></tbody>
        </table>
      </div>
    </section>

    <section id="bilanView" class="hidden">
      <div class="toolbar">
        <button id="btnBack" class="secondary" type="button">← Retour à la liste</button>
        <button id="btnDetails" type="button">Détails</button>
      </div>
      <div id="bilanContent"></div>
    </section>

    <section id="detailsView" class="hidden">
      <div class="toolbar">
        <button id="btnBackBilan" class="secondary" type="button">← Retour au bilan</button>
      </div>
      <div id="detailsContent"></div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sql.js@1.12.0/dist/sql-wasm.js"></script>
  <script src="./config.js"></script>
  <script src="./truck_db.js"></script>
  <script src="./app.js"></script>
</body>
</html>
